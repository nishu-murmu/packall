<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Packall">
  <title>Packall</title>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1711"/>
      <stop offset="1" stop-color="#050806"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.52" r="0.6">
      <stop offset="0" stop-color="#3ddc9e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3ddc9e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="1" height="12" patternUnits="userSpaceOnUse">
      <rect width="1" height="6" fill="#000000" fill-opacity="0.26"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" rx="112" fill="url(#screen)"/>
  <rect width="1024" height="1024" rx="112" fill="url(#bloom)"/>

  <!-- ▚ glyph: two diagonal blocks arranged upper-left and lower-right -->
  <g filter="url(#glow)" fill="#3ddc9e">
    <rect x="232" y="192" width="280" height="280" rx="6"/>
    <rect x="512" y="552" width="280" height="280" rx="6"/>
  </g>

  <rect width="1024" height="1024" rx="112" fill="url(#scanlines)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="110" fill="none" stroke="#2e5c43" stroke-width="8"/>
</svg>
